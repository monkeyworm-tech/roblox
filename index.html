<!DOCTYPE html>
<html lang="en">
<head>
    <title>Roblox</title>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow, noodp, noydir" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui" />
    <meta http-equiv="X-UA-Compatible" content="requiresActiveX=true,IE=Edge,chrome=1" />
    <meta http-equiv="Content-Language" content="en-US" />
    
    <!-- PWA / Web App Manifest & Theme Settings -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#16181e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Roblox" />
    <link rel="apple-touch-icon" href="https://www.nocookie.net/logopedia/images/2/28/400x400ia-75.webp/revision/latest?cb=20260412004126" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }

        .iframe-default {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <iframe class="iframe-default" src="https://roblox-devt.github.io/home" allowfullscreen="true" scrolling="no" frameborder="0"></iframe>
    <script>
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registered:', reg.scope))
                    .catch(err => console.error('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
